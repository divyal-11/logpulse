# ============================================================================
# LogPulse Redis 7 Configuration
# In-Memory Stream Buffer & Crash-Resilient Message Queue
# ============================================================================

# Network & Port
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 512mb
# For Redis Streams, we explicitly use noeviction so messages are never dropped
# behind the back of consumers. Trimming is controlled via XADD ... MAXLEN ~ 1000000.
maxmemory-policy noeviction

# Append-Only File (AOF) Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Latency & Monitoring
latency-monitor-threshold 20
loglevel notice

